<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>B Words Picture Pronunciation</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family: system-ui, "Noto Sans TC", sans-serif;
    }

    /*
      圖片容器：
      只負責讓圖片完整顯示。
      不裁切、不改比例、不覆蓋文字。
    */
    .image-wrapper {
      position: relative;
      width: min(100vw, 1254px);
      margin: 0 auto;
    }

    .main-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      透明點擊層：
      放在圖片上方。
    */
    .click-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /*
      透明點擊區：
      不顯示任何顏色、外框、hover、focus、active 效果。
    */
    .word-hotspot {
      position: absolute;
      width: 10%;
      height: 4%;
      padding: 0;
      margin: 0;
      border: none;
      outline: none;
      background: transparent;
      color: transparent;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      pointer-events: auto;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }

    .word-hotspot:hover,
    .word-hotspot:focus,
    .word-hotspot:focus-visible,
    .word-hotspot:active {
      border: none !important;
      outline: none !important;
      background: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>

<body>

  <main class="min-h-screen flex items-center justify-center p-0 sm:p-4">
    <div class="image-wrapper">
      <img
        src="b_words_grid.png"
        alt="B Words 10x10 Vocabulary Grid"
        class="main-image"
      />

      <div id="clickLayer" class="click-layer" aria-label="B words pronunciation layer"></div>
    </div>
  </main>

  <script>
    /*
      ============================================================
      發音模式設定
      ============================================================

      版本 A：Web Speech API TTS 版
      使用方式：
      const PRONUNCIATION_MODE = "tts";

      版本 B：真人 mp3 音檔版
      使用方式：
      const PRONUNCIATION_MODE = "mp3";

      mp3 檔案路徑格式：
      audio/banana.mp3
      audio/beach-ball.mp3
      audio/birthday-cake.mp3
    */

    const PRONUNCIATION_MODE = "tts";
    // const PRONUNCIATION_MODE = "mp3";

    /*
      ============================================================
      100 個 B 開頭單字
      順序：從左到右、從上到下
      ============================================================
    */
    const WORDS = [
      "banana", "ball", "bear", "bee", "book", "boat", "broom", "bread", "bus", "balloon",
      "backpack", "bathtub", "baby", "bacon", "bagel", "barn", "basket", "bat", "beach ball", "beaver",
      "bed", "bell", "belt", "berries", "bicycle", "binoculars", "bird", "birthday cake", "blanket", "blender",
      "blouse", "blueberry", "bluebird", "bobbin", "body lotion", "boots", "bottle", "bow", "bowl", "box",
      "bracelet", "broccoli", "brooch", "brush", "bucket", "buffalo", "bug", "bulldozer", "bunny", "burger",
      "butterfly", "button", "burrito", "buoy", "bugle", "bulletin board", "bun", "beehive", "beetle", "beanie",
      "bookmark", "boomerang", "bonsai", "bouquet", "brick", "briefcase", "broth", "bubble wand", "bucket hat", "banjo",
      "bassoon", "baseball", "baseball cap", "basketball", "bathrobe", "battery", "beach umbrella", "bean", "beaker", "bench",
      "beret", "binder", "birdhouse", "biscuit", "blackboard", "blimp", "blossom", "blue jay", "boa", "boar",
      "bonnet", "bookcase", "bow tie", "breadstick", "broomstick", "bubble tea", "bulldog", "barrel", "birdcage", "birthday hat"
    ];

    let voices = [];
    let selectedVoice = null;
    let currentAudio = null;

    /*
      ============================================================
      版本 A：Web Speech API TTS
      - lang = en-US
      - rate = 0.85
      - 優先 Google / Microsoft / en-US voice
      - 點擊新單字時會停止上一個聲音
      ============================================================
    */
    function loadVoices() {
      if (!("speechSynthesis" in window)) return;

      voices = window.speechSynthesis.getVoices();

      selectedVoice =
        voices.find(voice =>
          voice.lang === "en-US" &&
          /google|microsoft|aria|jenny|samantha|natural|premium|enhanced/i.test(voice.name)
        ) ||
        voices.find(voice => voice.lang === "en-US") ||
        voices.find(voice => voice.lang && voice.lang.startsWith("en")) ||
        null;
    }

    if ("speechSynthesis" in window) {
      loadVoices();
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function speakWithTTS(word) {
      if (!("speechSynthesis" in window)) {
        alert("這個瀏覽器不支援 Web Speech API。");
        return;
      }

      stopAllSound();

      const utterance = new SpeechSynthesisUtterance(word);
      utterance.lang = "en-US";
      utterance.rate = 0.85;
      utterance.pitch = 1;
      utterance.volume = 1;

      if (selectedVoice) {
        utterance.voice = selectedVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    /*
      ============================================================
      版本 B：真人 mp3 音檔版
      檔名規則：
      banana          -> audio/banana.mp3
      beach ball      -> audio/beach-ball.mp3
      birthday cake   -> audio/birthday-cake.mp3

      若找不到 mp3，會自動改用 TTS。
      ============================================================
    */
    function speakWithMP3(word) {
      stopAllSound();

      const filename = createAudioFilename(word);
      const audioPath = `audio/${filename}.mp3`;

      currentAudio = new Audio(audioPath);
      currentAudio.currentTime = 0;

      currentAudio.play().catch(() => {
        console.warn(`找不到音檔：${audioPath}，改用 TTS 發音。`);
        speakWithTTS(word);
      });
    }

    function createAudioFilename(word) {
      return word
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function stopAllSound() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
    }

    function pronounce(word) {
      if (PRONUNCIATION_MODE === "mp3") {
        speakWithMP3(word);
      } else {
        speakWithTTS(word);
      }
    }

    /*
      ============================================================
      建立 100 個透明點擊區

      位置公式：
      width = 10%
      height = 4%
      left = 欄位 × 10%
      top = 列位 × 10% + 7%
      ============================================================
    */
    function createHotspots() {
      const clickLayer = document.getElementById("clickLayer");
      clickLayer.innerHTML = "";

      WORDS.forEach((word, index) => {
        const row = Math.floor(index / 10);
        const col = index % 10;

        const button = document.createElement("button");

        button.className = "word-hotspot";
        button.type = "button";
        button.setAttribute("aria-label", `Speak ${word}`);

        button.style.left = `${col * 10}%`;
        button.style.top = `${row * 10 + 7}%`;
        button.style.width = "10%";
        button.style.height = "4%";

        button.addEventListener("click", () => {
          pronounce(word);
        });

        clickLayer.appendChild(button);
      });
    }

    createHotspots();
  </script>

</body>
</html>
